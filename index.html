<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-Do Tracker</title>
<script>
  // Apply saved theme (or the system theme) before the page paints, to avoid a flash
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --bg: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 50%, #fce7f3 100%);
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --faint: #94a3b8;
    --border: #e2e8f0;
    --line: #f1f5f9;
    --input: #f8fafc;
    --hover: #f5f3ff;
    --btn: #f1f5f9;
    --btn-hover: #e0e7ff;
    --del-hover: #fee2e2;
    --shadow: 0 4px 20px rgba(99, 102, 241, 0.12);
    --accent: #6366f1;
    --overdue: #dc2626;
    --high-bg: #fee2e2;   --high: #b91c1c;
    --med-bg: #fef3c7;    --med: #b45309;
    --low-bg: #dcfce7;    --low: #15803d;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: linear-gradient(135deg, #0f172a 0%, #111827 50%, #1e1b4b 100%);
    --card: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --faint: #64748b;
    --border: #334155;
    --line: #2b384c;
    --input: #0f172a;
    --hover: #273248;
    --btn: #334155;
    --btn-hover: #4338ca;
    --del-hover: #7f1d1d;
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    --accent: #818cf8;
    --overdue: #f87171;
    --high-bg: rgba(248, 113, 113, .18);  --high: #fca5a5;
    --med-bg: rgba(251, 191, 36, .16);    --med: #fcd34d;
    --low-bg: rgba(74, 222, 128, .16);    --low: #86efac;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 32px 16px;
    padding-top: max(32px, env(safe-area-inset-top));
    padding-bottom: max(96px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    min-height: 100vh;
    color: var(--text);
    background: var(--bg);
    background-attachment: fixed;
    transition: color .2s;
  }
  .app { max-width: 900px; margin: 0 auto; }
  header { position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; min-height: 44px; }
  header #themeBtn { position: absolute; right: 0; top: 50%; transform: translateY(-50%); }
  h1 {
    margin: 0;
    padding: 0 56px;
    text-align: center;
    font-size: 2rem;
    color: #16803c; /* green */
  }
  #summary { margin: 0 0 16px; color: var(--muted); font-size: .95rem; }
  #summary b { color: var(--text); }
  #summary .bad { color: var(--overdue); font-weight: 700; }
  #themeBtn {
    width: 44px; height: 44px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--card);
    box-shadow: var(--shadow);
    font-size: 1.3rem;
    cursor: pointer;
    line-height: 1;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  form { display: flex; flex-wrap: wrap; gap: 8px; }
  input, select, textarea, button { font: inherit; }
  form input, form select, form textarea, .toolbar input[type=search], .toolbar select {
    padding: 6px 10px;
    font-size: .92rem;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--input);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  form input:focus, form select:focus, form textarea:focus, .toolbar input:focus, .toolbar select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
  }
  #item { flex: 3 1 160px; }
  #priority { flex: 0 0 auto; }
  #deadline { flex: 0 0 auto; }
  #requestedBy { flex: 1 1 120px; min-width: 0; }
  #notes { flex: 1 1 100%; resize: vertical; min-height: 0; }
  #submitBtn {
    padding: 6px 20px;
    border: 0;
    border-radius: 10px;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
    transition: transform .1s, box-shadow .15s;
  }
  #submitBtn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); }

  /* search / filter / sort bar */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; }
  .toolbar input[type=search] { flex: 2 1 140px; }
  .toolbar select { flex: 1 1 110px; min-width: 0; }
  .toolbar label { display: flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .toolbar .link {
    border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 8px 4px;
  }
  .toolbar .link:hover { text-decoration: underline; }

  .table-wrap { padding: 8px 12px; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    padding: 12px 8px;
    border-bottom: 2px solid var(--border);
    user-select: none;
  }
  th[data-sort] { cursor: pointer; }
  th[data-sort]:hover { color: var(--accent); }
  th.active { color: var(--accent); }
  td { padding: 12px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:hover { background: var(--hover); }
  tbody tr:last-child td { border-bottom: 0; }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
  .note { margin-top: 4px; font-size: .85rem; color: var(--muted); white-space: pre-wrap; }

  .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: .8rem; font-weight: 600; }
  .badge.High { background: var(--high-bg); color: var(--high); }
  .badge.Medium { background: var(--med-bg); color: var(--med); }
  .badge.Low { background: var(--low-bg); color: var(--low); }

  .overdue { color: var(--overdue); font-weight: 700; }
  .tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: .72rem; font-weight: 600; white-space: nowrap; }
  .tag.late { background: var(--high-bg); color: var(--high); }
  .tag.soon { background: var(--med-bg); color: var(--med); }
  .done td { color: var(--faint); }
  .done td:nth-child(2), .done td:nth-child(4), .done td:nth-child(5) { text-decoration: line-through; }
  .done .badge { opacity: .5; }

  .actions { white-space: nowrap; text-align: right; }
  .actions button {
    border: 0;
    background: var(--btn);
    border-radius: 8px;
    padding: 6px 8px;
    margin-left: 4px;
    cursor: pointer;
    transition: background .15s;
  }
  .actions button:hover { background: var(--btn-hover); }
  .actions button.del:hover { background: var(--del-hover); }
  .empty { text-align: center; color: var(--faint); padding: 24px; }

  /* undo message */
  #toast {
    position: fixed;
    left: 50%;
    bottom: max(20px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 14px;
    background: #1e293b;
    color: #fff;
    padding: 12px 16px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
    z-index: 10;
    max-width: calc(100vw - 28px);
  }
  [data-theme="dark"] #toast { background: #e2e8f0; color: #0f172a; }
  #toast.show { display: flex; }
  #toast button { border: 0; background: none; color: #a5b4fc; font-weight: 700; cursor: pointer; padding: 4px 6px; }
  [data-theme="dark"] #toast button { color: #4338ca; }

  /* ---------- Mobile (phones, e.g. iPhone 16 Pro Max is 440px wide) ---------- */
  @media (max-width: 640px) {
    body { padding-top: max(20px, env(safe-area-inset-top)); padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
    h1 { font-size: 1.6rem; }
    .card { padding: 12px; border-radius: 18px; margin-bottom: 12px; }

    /* 16px inputs stop iOS Safari from zooming in when a field is focused */
    form input, form select, form textarea, .toolbar input[type=search], .toolbar select {
      font-size: 16px; width: 100%; min-height: 42px; flex: 1 1 100%;
    }
    #priority, #deadline, #priorityFilter, #requesterFilter { flex: 1 1 calc(50% - 4px); width: auto; }
    #requestedBy { flex: 1 1 calc(50% - 4px); width: auto; }
    #notes { flex: 1 1 calc(50% - 4px); width: auto; }
    #submitBtn { flex: 1 1 100%; min-height: 42px; font-size: 1rem; }
    .toolbar { padding: 10px 12px; }
    .toolbar label, .toolbar .link { min-height: 40px; }

    .table-wrap { background: none; box-shadow: none; padding: 0; }
    table, tbody { display: block; }
    thead { display: none; }

    /* each task becomes its own card */
    #list tr.task {
      display: grid;
      grid-template-columns: 32px 1fr auto;
      align-items: center;
      row-gap: 6px;
      background: var(--card);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    #list tr.task:hover { background: var(--card); }
    #list tr.task td { border: 0; padding: 0; }
    #list tr.task td:nth-child(1) { grid-column: 1; grid-row: 1; align-self: start; padding-top: 4px; }
    #list tr.task td:nth-child(2) { grid-column: 2; grid-row: 1; font-weight: 600; font-size: 1.05rem; padding-right: 8px; }
    #list tr.task td:nth-child(2) .note { font-weight: 400; font-size: .85rem; }
    #list tr.task td:nth-child(6) { grid-column: 3; grid-row: 1; align-self: start; }
    #list tr.task td:nth-child(3),
    #list tr.task td:nth-child(4),
    #list tr.task td:nth-child(5) { grid-column: 2 / 4; font-size: .92rem; }
    #list tr.task td:nth-child(3)::before,
    #list tr.task td:nth-child(4)::before,
    #list tr.task td:nth-child(5)::before {
      content: attr(data-label);
      display: inline-block;
      width: 96px;
      font-weight: 400;
      color: var(--muted);
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    input[type=checkbox] { width: 24px; height: 24px; }
    .actions button { font-size: 1.15rem; min-width: 44px; min-height: 44px; }
    .empty { background: var(--card); border-radius: 16px; display: block; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>To-Do Tracker</h1>
    <button id="themeBtn" type="button" aria-label="Toggle dark mode" title="Toggle dark / light mode"></button>
  </header>
  <p id="summary"></p>

  <div class="card">
    <form id="form">
      <input id="item" placeholder="Item" required>
      <select id="priority">
        <option>High</option>
        <option selected>Medium</option>
        <option>Low</option>
      </select>
      <input id="deadline" type="date">
      <input id="requestedBy" placeholder="Requested by">
      <textarea id="notes" rows="1" placeholder="Notes (optional)"></textarea>
      <button type="submit" id="submitBtn">Add</button>
    </form>
  </div>

  <div class="card toolbar">
    <input type="search" id="search" placeholder="Search tasks...">
    <select id="priorityFilter">
      <option value="">All priorities</option>
      <option>High</option>
      <option>Medium</option>
      <option>Low</option>
    </select>
    <select id="requesterFilter"><option value="">All requesters</option></select>
    <select id="sortBy" title="Sort by">
      <option value="smart">Sort: Deadline &amp; priority</option>
      <option value="deadline">Sort: Deadline</option>
      <option value="priority">Sort: Priority</option>
      <option value="item">Sort: Item</option>
      <option value="requestedBy">Sort: Requested by</option>
    </select>
    <label><input type="checkbox" id="hideDone"> Hide completed</label>
    <button type="button" class="link" id="clearDone">Clear completed</button>
  </div>

  <div class="card table-wrap">
    <table>
      <thead>
        <tr>
          <th>Done</th>
          <th data-sort="item">Item</th>
          <th data-sort="priority">Priority</th>
          <th data-sort="deadline">Deadline</th>
          <th data-sort="requestedBy">Requested by</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>
</div>

<div id="toast"><span id="toastText"></span><button type="button" id="undoBtn">Undo</button></div>

<script>
  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
  function $(id) { return document.getElementById(id); }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  var tasks = JSON.parse(load("tasks") || "[]");
  tasks.forEach(function (t) { if (!t.id) t.id = newId(); });   // older saved tasks have no id yet
  var editingId = null;

  function save() { store("tasks", JSON.stringify(tasks)); }

  // ---- theme toggle: shows a moon in light mode, a sun in dark mode ----
  var root = document.documentElement;
  function showThemeIcon() {
    $("themeBtn").textContent = root.getAttribute("data-theme") === "dark" ? "☀️" : "🌙";
  }
  $("themeBtn").onclick = function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    store("theme", next);
    showThemeIcon();
  };
  showThemeIcon();

  // ---- dates ----
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function today() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function daysUntil(dateStr) {
    var a = new Date(today() + "T00:00:00");
    var b = new Date(dateStr + "T00:00:00");
    return Math.round((b - a) / 86400000);
  }
  // Returns a small tag for deadlines that are late or close; nothing for done tasks
  function dueTag(t) {
    if (t.done || !t.deadline) return null;
    var d = daysUntil(t.deadline);
    if (d < 0) return { text: d === -1 ? "1 day late" : -d + " days late", cls: "late" };
    if (d === 0) return { text: "Due today", cls: "soon" };
    if (d === 1) return { text: "Tomorrow", cls: "soon" };
    if (d <= 3) return { text: "In " + d + " days", cls: "soon" };
    return null;
  }

  // ---- sorting ----
  var PRIORITY = { High: 0, Medium: 1, Low: 2 };
  function byDeadline(a, b) {
    return (a.deadline || "9999").localeCompare(b.deadline || "9999");
  }
  function byPriority(a, b) { return PRIORITY[a.priority] - PRIORITY[b.priority]; }
  function compare(a, b) {
    if (!!a.done !== !!b.done) return a.done ? 1 : -1;      // finished tasks go to the bottom
    var s = $("sortBy").value, r = 0;
    if (s === "item") r = a.item.localeCompare(b.item);
    else if (s === "requestedBy") r = (a.requestedBy || "￿").localeCompare(b.requestedBy || "￿");
    else if (s === "priority") r = byPriority(a, b) || byDeadline(a, b);
    else r = byDeadline(a, b) || byPriority(a, b);          // "smart" and "deadline"
    if (s === "deadline" && r === 0) r = byPriority(a, b);
    return r;
  }

  // ---- undo (for delete and clear completed) ----
  var undoItems = [];
  var toastTimer = null;
  function showToast(text, items) {
    undoItems = items;
    $("toastText").textContent = text;
    $("toast").className = "show";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast() { $("toast").className = ""; undoItems = []; }
  $("undoBtn").onclick = function () {
    undoItems.slice().sort(function (a, b) { return a.index - b.index; }).forEach(function (u) {
      tasks.splice(Math.min(u.index, tasks.length), 0, u.task);
    });
    hideToast();
    save();
    render();
  };

  function resetForm() {
    editingId = null;
    $("form").reset();
    $("deadline").value = today();   // default the deadline to today
    $("submitBtn").textContent = "Add";
  }

  function updateRequesterOptions() {
    var sel = $("requesterFilter"), current = sel.value;
    var names = [];
    tasks.forEach(function (t) { if (t.requestedBy && names.indexOf(t.requestedBy) < 0) names.push(t.requestedBy); });
    names.sort(function (a, b) { return a.localeCompare(b); });
    sel.innerHTML = '<option value="">All requesters</option>';
    names.forEach(function (n) {
      var o = document.createElement("option");
      o.value = n;
      o.textContent = n;
      sel.appendChild(o);
    });
    sel.value = names.indexOf(current) >= 0 ? current : "";
  }

  function updateSummary() {
    var open = 0, late = 0, soon = 0;
    tasks.forEach(function (t) {
      if (t.done) return;
      open++;
      if (t.deadline) {
        var d = daysUntil(t.deadline);
        if (d < 0) late++; else if (d <= 2) soon++;
      }
    });
    var html = "<b>" + open + "</b> open";
    if (late) html += ' · <span class="bad">' + late + " overdue</span>";
    if (soon) html += " · " + soon + " due soon";
    $("summary").innerHTML = html;
  }

  function matches(t) {
    var q = $("search").value.trim().toLowerCase();
    if (q && (t.item + " " + (t.notes || "") + " " + (t.requestedBy || "")).toLowerCase().indexOf(q) < 0) return false;
    if ($("priorityFilter").value && t.priority !== $("priorityFilter").value) return false;
    if ($("requesterFilter").value && t.requestedBy !== $("requesterFilter").value) return false;
    if ($("hideDone").checked && t.done) return false;
    return true;
  }

  function startEdit(t) {
    $("item").value = t.item;
    $("priority").value = t.priority;
    $("deadline").value = t.deadline;
    $("requestedBy").value = t.requestedBy;
    $("notes").value = t.notes || "";
    $("submitBtn").textContent = "Save";
    editingId = t.id;
    window.scrollTo({ top: 0, behavior: "smooth" });
    $("item").focus();
  }

  function render() {
    updateRequesterOptions();
    updateSummary();

    // highlight the sorted column header
    var sortKey = $("sortBy").value;
    document.querySelectorAll("th[data-sort]").forEach(function (th) {
      th.className = th.getAttribute("data-sort") === sortKey ? "active" : "";
    });

    var list = $("list");
    list.innerHTML = "";
    var shown = tasks.filter(matches).sort(compare);
    if (shown.length === 0) {
      var msg = tasks.length === 0 ? "No tasks yet. Add one above!" : "No tasks match your filters.";
      list.innerHTML = '<tr><td colspan="6" class="empty">' + msg + "</td></tr>";
      return;
    }

    shown.forEach(function (t) {
      var tr = document.createElement("tr");
      tr.className = t.done ? "task done" : "task";

      // done checkbox
      var cb = document.createElement("td");
      var box = document.createElement("input");
      box.type = "checkbox";
      box.checked = !!t.done;
      box.onchange = function () { t.done = box.checked; save(); render(); };
      cb.appendChild(box);
      tr.appendChild(cb);

      // item + notes
      var tdItem = document.createElement("td");
      tdItem.appendChild(document.createTextNode(t.item));
      if (t.notes) {
        var note = document.createElement("div");
        note.className = "note";
        note.textContent = t.notes;
        tdItem.appendChild(note);
      }
      tr.appendChild(tdItem);

      // priority badge
      var tdPri = document.createElement("td");
      tdPri.setAttribute("data-label", "Priority");
      var badge = document.createElement("span");
      badge.className = "badge " + t.priority;
      badge.textContent = t.priority;
      tdPri.appendChild(badge);
      tr.appendChild(tdPri);

      // deadline + due tag
      var tdDue = document.createElement("td");
      tdDue.setAttribute("data-label", "Deadline");
      tdDue.appendChild(document.createTextNode(t.deadline || ""));
      var tag = dueTag(t);
      if (tag) {
        if (tag.cls === "late") tdDue.className = "overdue";
        var span = document.createElement("span");
        span.className = "tag " + tag.cls;
        span.textContent = tag.text;
        tdDue.appendChild(span);
      }
      tr.appendChild(tdDue);

      // requested by
      var tdReq = document.createElement("td");
      tdReq.setAttribute("data-label", "Requested by");
      tdReq.textContent = t.requestedBy;
      tr.appendChild(tdReq);

      // edit / delete
      var tdAct = document.createElement("td");
      tdAct.className = "actions";
      var edit = document.createElement("button");
      edit.textContent = "✏️";
      edit.title = "Edit";
      edit.onclick = function () { startEdit(t); };
      tdAct.appendChild(edit);
      var del = document.createElement("button");
      del.className = "del";
      del.textContent = "🗑️";
      del.title = "Delete";
      del.onclick = function () {
        var index = tasks.indexOf(t);
        tasks.splice(index, 1);
        if (editingId === t.id) resetForm();
        save();
        render();
        showToast("Task deleted.", [{ task: t, index: index }]);
      };
      tdAct.appendChild(del);
      tr.appendChild(tdAct);

      list.appendChild(tr);
    });
  }

  $("form").onsubmit = function (e) {
    e.preventDefault();
    var data = {
      item: $("item").value.trim(),
      priority: $("priority").value,
      deadline: $("deadline").value,
      requestedBy: $("requestedBy").value.trim(),
      notes: $("notes").value.trim()
    };
    if (!data.item) return;
    var existing = null;
    tasks.forEach(function (t) { if (t.id === editingId) existing = t; });
    if (existing) {
      existing.item = data.item;
      existing.priority = data.priority;
      existing.deadline = data.deadline;
      existing.requestedBy = data.requestedBy;
      existing.notes = data.notes;
    } else {
      data.id = newId();
      tasks.push(data);
    }
    resetForm();
    save();
    render();
  };

  $("clearDone").onclick = function () {
    var removed = [];
    tasks.forEach(function (t, i) { if (t.done) removed.push({ task: t, index: i }); });
    if (removed.length === 0) return;
    tasks = tasks.filter(function (t) { return !t.done; });
    if (editingId && !tasks.some(function (t) { return t.id === editingId; })) resetForm();
    save();
    render();
    showToast(removed.length + (removed.length === 1 ? " completed task" : " completed tasks") + " cleared.", removed);
  };

  ["search", "priorityFilter", "requesterFilter", "sortBy", "hideDone"].forEach(function (id) {
    $(id).oninput = render;
    $(id).onchange = render;
  });
  document.querySelectorAll("th[data-sort]").forEach(function (th) {
    th.onclick = function () { $("sortBy").value = th.getAttribute("data-sort"); render(); };
  });

  $("deadline").value = today();
  render();
</script>
</body>
</html>
